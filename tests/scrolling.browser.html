<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>横スクロール結合テスト</title>
<style>body{font:16px sans-serif;background:#faf8f0;margin:20px}button{padding:12px;margin:4px}#stage{width:min(100%,1200px)}canvas{max-width:100%;height:auto}#results{white-space:pre-wrap}</style>
<h1>横スクロール結合テスト</h1>
<p>現行のWalkSceneで左右の長距離移動・ジャンプ・リセット・ステージ再起動を検証します。</p>
<button id="run" disabled>結合テストを実行</button>
<button id="sample-right" disabled>右へ4秒進める</button><button id="sample-left" disabled>左へ4秒進める</button>
<button id="reset">まんなかに戻る</button>
<button data-action="left">左へ</button><button data-action="right">右へ</button><button data-action="jump">ジャンプ</button>
<p id="loading">読み込み中</p><p id="state"></p><pre id="results" role="status"></pre>
<div id="stage" tabindex="0"></div>
<script type="module" src="./scrolling.browser.js"></script>
</html>
