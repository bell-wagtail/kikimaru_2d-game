<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>移動・横スクロール・障害物結合テスト</title>
<link rel="stylesheet" href="../src/style.css">
<style>body{font:16px sans-serif;background:#faf8f0;margin:20px}button{padding:12px;margin:4px}#stage{width:min(100%,1200px)}canvas{max-width:100%;height:auto}#results{white-space:pre-wrap}</style>
<h1>移動・横スクロール・障害物結合テスト</h1>
<p>現行のWalkSceneで加減速・長距離移動・岩の衝突・文字マップの段差を登る連続ジャンプ・アイテム取得とパワーアップ・穴への落下とリスポーン・座標補正・リセットを検証します。</p>
<button id="run" disabled>結合テストを実行</button>
<button id="sample-right" disabled>右へ4秒進める</button><button id="sample-left" disabled>左へ4秒進める</button>
<button id="sample-hole" disabled>穴の手前を表示</button>
<button data-feedback-preview="tea" disabled>お茶の発光を見る</button>
<button data-feedback-preview="shrimp" disabled>えびの発光を見る</button>
<button data-feedback-preview="both" disabled>両方の発光を見る</button>
<button data-feedback-preview="ending" disabled>終了通知を見る</button>
<button data-speed-preview="half" disabled>加速途中の線を見る</button>
<button data-speed-preview="full" disabled>最高速度の線を見る</button>
<button data-speed-preview="both" disabled>発光とスピード線を見る</button>
<button data-quiz-preview disabled>クイズを見る</button>
<button data-fruit-preview disabled>果物を見る</button>
<button id="reset">まんなかに戻る</button>
<button data-action="left">左へ</button><button data-action="right">右へ</button><button data-action="jump">ジャンプ</button>
<p id="loading">読み込み中</p><p id="state"></p><p>スコア <output id="score">0点</output></p><pre id="results" role="status"></pre>
<div id="stage" tabindex="0"></div>
<script type="module" src="./scrolling.browser.js"></script>
</html>
