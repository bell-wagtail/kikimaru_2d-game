<style>*{box-sizing:border-box}body{margin:0;background:#f7f5fa;color:#393345;font-family:system-ui,sans-serif}main{max-width:1120px;margin:28px auto;padding:0 20px}h1{font-size:26px;margin:0 0 8px}p{font-size:14px;line-height:1.7;color:#655d70}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:18px 0}button,select{font:inherit;padding:8px 14px;border:1px solid #d5cede;border-radius:8px;background:white}input[type=color]{vertical-align:middle;border:0;background:none;height:36px;width:50px}canvas{width:100%;display:block;border:1px solid #e0dae7;border-radius:18px;background:#fff}.items{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.item{width:106px;background:white;border-radius:12px;padding:10px;text-align:center;font-size:12px}.item img{width:78px;height:78px;object-fit:contain}small{color:#766b81}</style>
<main><h1>ききまる / 素材プレビュー</h1><p>正面・右向きの分割パーツを組み立てた動作見本です。ゲーム本体ではありません。左向きは右向き全体の反転で対応します。</p>
<div class="controls"><label>動作 <select id="motion"><option value="idle">待機</option><option value="run">走る</option><option value="jump">ジャンプ・着地</option><option value="celebrate">万歳・喜びジャンプ</option><option value="surprised">びっくり</option></select></label><label>エプロン <input id="color" type="color" value="#85a86d"></label><button id="pause">一時停止</button><label><input id="mirror" type="checkbox">右向きを左右反転</label></div>
<canvas id="stage" width="1080" height="620"></canvas><div class="items" id="items"></div><small>補助素材の食べ物は候補です。地元クイズや収集効果はローカルで制作するゲーム側で決定してください。</small></main>
<script>const rig={"canvas":{"width":400,"height":560,"groundY":540},"defaultApronColor":"#85a86d","views":{"front":[{"id":"left_foot","part":"foot","x":90,"y":489,"w":103,"h":56,"pivot":[0.5,0.1]},{"id":"right_foot","part":"foot","x":214,"y":489,"w":103,"h":56,"pivot":[0.5,0.1],"mirror":true},{"id":"body","part":"body","x":83,"y":278,"w":234,"h":230,"pivot":[0.5,0.1]},{"id":"apron","part":"apron_tint","x":106,"y":316,"w":188,"h":180,"pivot":[0.5,0.1],"tint":true},{"id":"badge","part":"badge","x":144,"y":401,"w":112,"h":67,"pivot":[0.5,0.1]},{"id":"far_arm","part":"arm","x":79,"y":334,"w":43,"h":100,"pivot":[0.5,0.1],"mirror":true},{"id":"near_arm","part":"arm","x":278,"y":334,"w":43,"h":100,"pivot":[0.5,0.1]},{"id":"head","part":"head_idle","x":20,"y":15,"w":360,"h":329,"pivot":[0.5,0.1]}],"right":[{"id":"far_arm","part":"arm","x":282,"y":334,"w":40,"h":94,"pivot":[0.5,0.1],"mirror":true},{"id":"left_foot","part":"foot","x":117,"y":491,"w":98,"h":53,"pivot":[0.5,0.1]},{"id":"right_foot","part":"foot","x":213,"y":491,"w":105,"h":56,"pivot":[0.5,0.1]},{"id":"body","part":"body","x":99,"y":282,"w":222,"h":220,"pivot":[0.5,0.1]},{"id":"apron","part":"apron_tint","x":144,"y":320,"w":164,"h":174,"pivot":[0.5,0.1],"tint":true},{"id":"badge","part":"badge","x":173,"y":405,"w":104,"h":67,"pivot":[0.5,0.1]},{"id":"near_arm","part":"arm","x":106,"y":332,"w":45,"h":100,"pivot":[0.5,0.1]},{"id":"head","part":"head_idle","x":20,"y":15,"w":360,"h":338,"pivot":[0.5,0.1]}]},"notes":["Coordinates are starter rig layout verified in preview, not physical hitboxes.","Left-facing mirrors entire right rig.","Arm art is reused/mirrored for pairs; full-body parts animate by translation/rotation.","Render raised arms after head so victory hands stay visible.","Apron is tinted separately; badge remains untinted."]}, manifest={"version":2,"character":"ききまる","format":"RGBA PNG","method":"AI-generated cutout parts, cropped without resampling","files":[{"key":"front/head_idle","path":"assets/character/front/head_idle.png","width":385,"height":353,"sourceAtlas":"source-atlases/front.png","sourceRect":{"left":34,"top":75,"width":385,"height":353},"tintable":false},{"key":"front/head_happy","path":"assets/character/front/head_happy.png","width":385,"height":353,"sourceAtlas":"source-atlases/front.png","sourceRect":{"left":433,"top":75,"width":385,"height":353},"tintable":false},{"key":"front/head_surprised","path":"assets/character/front/head_surprised.png","width":385,"height":353,"sourceAtlas":"source-atlases/front.png","sourceRect":{"left":834,"top":75,"width":385,"height":353},"tintable":false},{"key":"front/body","path":"assets/character/front/body.png","width":340,"height":332,"sourceAtlas":"source-atlases/front.png","sourceRect":{"left":62,"top":518,"width":340,"height":332},"tintable":false},{"key":"front/apron_tint","path":"assets/character/front/apron_tint.png","width":311,"height":298,"sourceAtlas":"source-atlases/front.png","sourceRect":{"left":470,"top":532,"width":311,"height":298},"tintable":true},{"key":"front/arm","path":"assets/character/front/arm.png","width":286,"height":777,"sourceAtlas":"source-atlases/straight_arm.png","sourceRect":{"left":484,"top":241,"width":286,"height":777},"tintable":false},{"key":"front/foot","path":"assets/character/front/foot.png","width":251,"height":142,"sourceAtlas":"source-atlases/front.png","sourceRect":{"left":114,"top":1013,"width":251,"height":142},"tintable":false},{"key":"front/badge","path":"assets/character/front/badge.png","width":283,"height":173,"sourceAtlas":"source-atlases/front.png","sourceRect":{"left":485,"top":979,"width":283,"height":173},"tintable":false},{"key":"front/sparkle","path":"assets/character/front/sparkle.png","width":181,"height":189,"sourceAtlas":"source-atlases/front.png","sourceRect":{"left":936,"top":958,"width":181,"height":189},"tintable":false},{"key":"right/head_idle","path":"assets/character/right/head_idle.png","width":388,"height":364,"sourceAtlas":"source-atlases/right.png","sourceRect":{"left":36,"top":70,"width":388,"height":364},"tintable":false},{"key":"right/head_happy","path":"assets/character/right/head_happy.png","width":388,"height":364,"sourceAtlas":"source-atlases/right.png","sourceRect":{"left":431,"top":70,"width":388,"height":364},"tintable":false},{"key":"right/head_surprised","path":"assets/character/right/head_surprised.png","width":388,"height":364,"sourceAtlas":"source-atlases/right.png","sourceRect":{"left":834,"top":70,"width":388,"height":364},"tintable":false},{"key":"right/body","path":"assets/character/right/body.png","width":334,"height":327,"sourceAtlas":"source-atlases/right.png","sourceRect":{"left":70,"top":521,"width":334,"height":327},"tintable":false},{"key":"right/apron_tint","path":"assets/character/right/apron_tint.png","width":312,"height":312,"sourceAtlas":"source-atlases/right.png","sourceRect":{"left":495,"top":525,"width":312,"height":312},"tintable":true},{"key":"right/arm","path":"assets/character/right/arm.png","width":286,"height":777,"sourceAtlas":"source-atlases/straight_arm.png","sourceRect":{"left":484,"top":241,"width":286,"height":777},"tintable":false},{"key":"right/foot","path":"assets/character/right/foot.png","width":264,"height":145,"sourceAtlas":"source-atlases/right.png","sourceRect":{"left":114,"top":1008,"width":264,"height":145},"tintable":false},{"key":"right/badge","path":"assets/character/right/badge.png","width":286,"height":190,"sourceAtlas":"source-atlases/right.png","sourceRect":{"left":495,"top":965,"width":286,"height":190},"tintable":false},{"key":"right/dust","path":"assets/character/right/dust.png","width":259,"height":158,"sourceAtlas":"source-atlases/right.png","sourceRect":{"left":904,"top":992,"width":259,"height":158},"tintable":false},{"key":"props/tea","path":"assets/props/tea.png","width":315,"height":282,"sourceAtlas":"source-atlases/props.png","sourceRect":{"left":77,"top":141,"width":315,"height":282},"tintable":false},{"key":"props/mandarin","path":"assets/props/mandarin.png","width":317,"height":354,"sourceAtlas":"source-atlases/props.png","sourceRect":{"left":471,"top":75,"width":317,"height":354},"tintable":false},{"key":"props/strawberry","path":"assets/props/strawberry.png","width":284,"height":346,"sourceAtlas":"source-atlases/props.png","sourceRect":{"left":889,"top":83,"width":284,"height":346},"tintable":false},{"key":"props/shrimp","path":"assets/props/shrimp.png","width":293,"height":312,"sourceAtlas":"source-atlases/props.png","sourceRect":{"left":84,"top":483,"width":293,"height":312},"tintable":false},{"key":"props/fish","path":"assets/props/fish.png","width":390,"height":267,"sourceAtlas":"source-atlases/props.png","sourceRect":{"left":443,"top":515,"width":390,"height":267},"tintable":false},{"key":"props/quiz_marker","path":"assets/props/quiz_marker.png","width":311,"height":310,"sourceAtlas":"source-atlases/props.png","sourceRect":{"left":874,"top":493,"width":311,"height":310},"tintable":false},{"key":"props/goal_flag","path":"assets/props/goal_flag.png","width":308,"height":372,"sourceAtlas":"source-atlases/props.png","sourceRect":{"left":78,"top":812,"width":308,"height":372},"tintable":false},{"key":"props/rock","path":"assets/props/rock.png","width":340,"height":254,"sourceAtlas":"source-atlases/props.png","sourceRect":{"left":455,"top":931,"width":340,"height":254},"tintable":false},{"key":"props/dust_enemy","path":"assets/props/dust_enemy.png","width":370,"height":282,"sourceAtlas":"source-atlases/props.png","sourceRect":{"left":845,"top":900,"width":370,"height":282},"tintable":false},{"key":"background/tea_river","path":"assets/backgrounds/tea_river.png","width":1536,"height":1024,"seamless":false}]};
const images={},tints=new Map(),cv=document.getElementById('stage'),ctx=cv.getContext('2d');let running=true,last=0,time=0;
const color=document.getElementById('color'),motion=document.getElementById('motion'),mirror=document.getElementById('mirror');
document.getElementById('pause').onclick=()=>{running=!running;document.getElementById('pause').textContent=running?'一時停止':'再生'};
function tint(img,hex){const key=img.src+hex;if(tints.has(key))return tints.get(key);const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);x.globalCompositeOperation='multiply';x.fillStyle=hex;x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='destination-in';x.drawImage(img,0,0);tints.set(key,c);return c}
function actor(view,cx,ground,scale){const m=motion.value,t=time,run=m==='run',celebrate=m==='celebrate',jump=m==='jump';let bob=run?Math.abs(Math.sin(t*11))*7:Math.sin(t*2.5)*2;let sy=1,sx=1;if(jump||celebrate){const phase=(t%(celebrate?1.0:1.6))/(celebrate?1.0:1.6);bob=Math.sin(phase*Math.PI)* (celebrate?48:75);if(phase>.87){sy=0.93;sx=1.04}}ctx.save();ctx.translate(cx,ground-bob*scale);ctx.scale(scale*(view==='right'&&mirror.checked?-1:1),scale);ctx.scale(sx,sy);ctx.translate(-200,-rig.canvas.groundY);let parts=[...rig.views[view]];if(celebrate)parts.sort((a,b)=>Number(a.id.includes('arm'))-Number(b.id.includes('arm')));for(const p of parts){let part=p.part;if(p.id==='head')part=celebrate?'head_happy':m==='surprised'?'head_surprised':'head_idle';let img=images[view+'/'+part],dx=0,dy=0,rot=0;if(p.id.includes('foot')&&run){const s=p.id==='left_foot'?1:-1;dx=Math.sin(t*11)*s*15;dy=-Math.max(0,Math.cos(t*11)*s)*10;rot=Math.sin(t*11)*s*.13}if(p.id.includes('arm')){const s=p.x<200?1:-1;if(run)rot=Math.sin(t*11)*s*.35;if(celebrate)rot=s*2.35+Math.sin(t*7)*s*.12;if(jump)rot=s*.38}if(p.tint)img=tint(img,color.value);ctx.save();const [px,py]=p.pivot;ctx.translate(p.x+p.w*px+dx,p.y+p.h*py+dy);ctx.rotate(rot);if(p.mirror)ctx.scale(-1,1);ctx.drawImage(img,-p.w*px,-p.h*py,p.w,p.h);ctx.restore()}ctx.restore()}
function draw(ts){if(last&&running)time+=Math.min((ts-last)/1000,.04);last=ts;ctx.clearRect(0,0,1080,620);ctx.fillStyle='#fcfaf7';ctx.fillRect(0,0,540,620);ctx.fillStyle='#eef3f8';ctx.fillRect(540,0,540,620);ctx.fillStyle='#695777';ctx.font='600 21px system-ui';ctx.textAlign='center';ctx.fillText('正面 / Result・リアクション',270,45);ctx.fillText('右向き / 移動',810,45);ctx.fillStyle='#dfd9e1';for(const x of [270,810]){ctx.beginPath();ctx.ellipse(x,570,113,12,0,0,Math.PI*2);ctx.fill()}actor('front',270,570,.87);actor('right',810,570,.87);requestAnimationFrame(draw)}
Promise.all(manifest.files.map(f=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{images[f.key]=i;resolve()};i.onerror=()=>reject(Error(f.path));i.src=f.path}))).then(()=>{window.assetsReady=true;requestAnimationFrame(draw)}).catch(e=>{document.body.insertAdjacentHTML('beforeend','<p>画像の読み込みに失敗しました。ZIPを展開してから開いてください。</p>');console.error(e)});
const labels={tea:'お茶',mandarin:'みかん',strawberry:'いちご',shrimp:'えび',fish:'魚',quiz_marker:'クイズ',goal_flag:'ゴール',rock:'岩',dust_enemy:'ほこりの敵'};for(const f of manifest.files.filter(f=>f.key.startsWith('props/'))){const d=document.createElement('div');d.className='item';const i=document.createElement('img');i.src=f.path;i.alt=labels[f.key.split('/')[1]];d.append(i,document.createElement('br'),document.createTextNode(i.alt));document.getElementById('items').append(d)}
</script></html>
