name: GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: true

jobs:
  security:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security-scan.yml

  build:
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    needs: security
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful security scan
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$SECURITY_RESULT" != success ]; then
            echo "Security scan did not succeed: $SECURITY_RESULT"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up mise tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Install locked dependencies
        run: mise exec -- npm --cache .npm-cache ci --ignore-scripts
      - name: Audit dependencies
        run: mise exec -- npm --cache .npm-cache audit --audit-level=high
      - name: Unit tests
        run: mise exec -- npm --cache .npm-cache test
      - name: Type check and build for the project URL
        env:
          PAGES_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: mise exec -- npm --cache .npm-cache run build -- --base "/$PAGES_REPOSITORY_NAME/"
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
